expertise: OpenTelemetry
custodian: otel-expert
last_updated: "2026-03-20"

overview:
  description: >
    OpenTelemetry is a vendor-neutral observability framework providing three
    signals: traces, metrics, and logs.
  components:
    api: >
      Cross-cutting interfaces for instrumentation. Libraries use this only,
      never the SDK directly.
    sdk: >
      The implementation of the API. Configured by application owners.
    instrumentation_libraries: >
      Enable observability for existing libraries. Named
      opentelemetry-instrumentation-[library].
  context: >
    All signals share a Context mechanism for maintaining state across
    distributed transactions.

key_packages:
  - opentelemetry-api
  - opentelemetry-sdk

spans:
  description: >
    A span is the building block of a trace; represents a unit of work with
    start and end timestamps.
  structure:
    - name
    - parent_span_id: empty for root spans
    - start_timestamp
    - end_timestamp
    - span_context:
        fields:
          - trace_id
          - span_id
          - trace_flags
          - trace_state
    - attributes
    - events
    - links
    - status
  kinds:
    SERVER: incoming remote call
    CLIENT: outgoing remote call
    INTERNAL: within a single process
    PRODUCER: async job creation
    CONSUMER: async job processing
  attributes:
    description: Key-value metadata attached to a span.
    key_type: non-null string
    value_types:
      - string
      - bool
      - number
      - array
    note: Semantic conventions standardise common attribute names.
  events:
    description: >
      Meaningful point-in-time occurrences with timestamps. Use events when
      timing matters; use attributes otherwise.
  status:
    values:
      Unset: default; implies success
      Ok: explicit success
      Error: an error occurred
  links:
    description: >
      Optional associations to causally related spans across traces.

traces:
  description: >
    A trace is a set of spans organised as a directed acyclic graph with
    parent-child relationships.
  root_span: has no parent; all spans in the trace share the same trace ID
  span_context: immutable; enables propagation across processes

context_propagation:
  description: >
    Propagation moves context (trace identity, baggage) between services and
    processes.
  default_headers: W3C Trace Context HTTP headers (Python default)
  propagators:
    TraceContextTextMapPropagator:
      inject: inject(headers, ctx)
      extract: extract(carrier=headers)
    W3CBaggagePropagator: handles baggage key-value metadata propagation
  async_and_thread_boundaries:
    preferred: use instrumentation libraries where possible; they handle this automatically
    manual_pattern: >
      Inject context into headers before crossing the boundary; extract on
      the other side.

python_sdk:
  setup:
    description: Minimal setup to configure a TracerProvider and obtain a Tracer.
    code: |
      from opentelemetry import trace
      from opentelemetry.sdk.trace import TracerProvider
      from opentelemetry.sdk.trace.export import BatchSpanProcessor, ConsoleSpanExporter

      provider = TracerProvider()
      provider.add_span_processor(BatchSpanProcessor(ConsoleSpanExporter()))
      trace.set_tracer_provider(provider)
      tracer = trace.get_tracer("my.tracer.name")

  creating_spans:
    context_manager:
      recommended: true
      pattern: "with tracer.start_as_current_span(\"name\") as span:"
    decorator:
      pattern: "@tracer.start_as_current_span(\"name\")"
    nested: >
      Nest start_as_current_span calls; the inner span becomes a child of the
      outer span.

  enriching_spans:
    attributes:
      pattern: trace.get_current_span().set_attribute("key", "value")
    events:
      pattern: span.add_event("Something happened")
    status_and_exception:
      pattern: |
        span.set_status(Status(StatusCode.ERROR))
        span.record_exception(ex)

sdk_internals:
  tracer_provider:
    owns:
      - span processors
      - ID generators
      - span limits
      - samplers
    notes:
      - Creates Tracer instances.
      - Config changes apply to all already-returned Tracers.
    methods:
      - Shutdown()
      - ForceFlush()

  sampler:
    method: ShouldSample()
    return_values:
      - DROP
      - RECORD_ONLY
      - RECORD_AND_SAMPLE
    built_in_samplers:
      - AlwaysOn
      - AlwaysOff
      - TraceIdRatioBased
      - ParentBased
      - ProbabilitySampler

  span_processor:
    on_start:
      called: synchronously at span start
      access: read/write
    on_end:
      called: after span ends
      access: read-only
    implementations:
      SimpleSpanProcessor: exports immediately on end
      BatchSpanProcessor: batches by queue size or scheduled delay; recommended for production

  span_exporter:
    export: "Export(batch): sends spans; returns Success or Failure"
    shutdown: "Shutdown(): cleanup"
    force_flush: "ForceFlush(): flush pending spans before returning"
    notes:
      - Must not block indefinitely.
      - Retry logic is the processor's responsibility.

  span_creation_flow:
    steps:
      - generate trace ID
      - query sampler
      - generate span ID
      - create span
      - processors
      - exporters

axiom_integration:
  endpoints:
    traces: https://AXIOM_DOMAIN/v1/traces
    logs: https://AXIOM_DOMAIN/v1/logs
    metrics: https://AXIOM_DOMAIN/v1/metrics
  required_headers:
    all_signals:
      Authorization: Bearer API_TOKEN
    traces_and_logs:
      X-Axiom-Dataset: DATASET_NAME
    metrics:
      X-Axiom-Metrics-Dataset: DATASET_NAME
  critical_rules:
    - Each signal type MUST use a dedicated separate dataset.
    - Metrics endpoint only supports protobuf format, not JSON.
    - Store the API token in an environment variable, never hardcoded.
  log_severity_fields_for_highlighting:
    - severity
    - severityNumber
    - severityText
  python_config:
    code: |
      from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter

      exporter = OTLPSpanExporter(
          endpoint="https://AXIOM_DOMAIN/v1/traces",
          headers={
              "Authorization": "Bearer API_TOKEN",
              "X-Axiom-Dataset": "DATASET_NAME",
          }
      )

antkeeper_implementation:
  status: "implemented"
  last_validated: "2026-03-20"
  design_principles:
    - "No singleton/wrapper module — each call site uses trace.get_tracer('antkeeper') directly"
    - "No TracerProvider setup in library code — deployer configures via OTEL_* env vars or opentelemetry-distro"
    - "No @traced decorator — explicit with tracer.start_as_current_span(...) at three call sites"
    - "Flat attribute names (run_id, session_id) not OTel semantic convention namespaces"
    - "OTel packages are core dependencies, not optional extras"
    - "Context propagation is automatic via Python contextvars (synchronous call chain)"
    - "Cross-process propagation via opentelemetry.propagate.inject() into subprocess env"
  core_dependencies:
    - opentelemetry-api
    - opentelemetry-sdk
    - opentelemetry-exporter-otlp-proto-http
    - opentelemetry-distro
  activation:
    method: "Wrap command with opentelemetry-instrument (from opentelemetry-distro)"
    why: "Library code only calls trace.get_tracer('antkeeper') — no TracerProvider is configured. opentelemetry-instrument auto-configures TracerProvider, exporter, and processors from OTEL_* env vars."
    required_env:
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: >
        MUST be set to "http/protobuf". Without it, the auto-configurator tries
        otlp_proto_grpc (not installed in the venv), fails silently, falls back
        to ProxyTracerProvider (no-op), and resource attributes are lost.
    example: |
      export OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="https://api.axiom.co/v1/traces"
      export OTEL_EXPORTER_OTLP_TRACES_HEADERS="Authorization=Bearer api_xxx,X-Axiom-Dataset=antkeeper"
      export OTEL_EXPORTER_OTLP_TRACES_PROTOCOL="http/protobuf"
      export OTEL_SERVICE_NAME="antkeeper"
      opentelemetry-instrument antkeeper run --model sonnet sdlc prompts/add-auth.md
    server_example: "opentelemetry-instrument antkeeper server --host 0.0.0.0 --port 8000"
    no_op_behavior: "Without opentelemetry-instrument, OTEL_* env vars have no effect — get_tracer() returns the no-op tracer (zero overhead)"
    afk_wrapper:
      description: >
        The afk wrapper script calls with-otel to layer Claude Code telemetry
        config. Division of responsibility: afk owns traces (per-signal
        OTEL_EXPORTER_OTLP_TRACES_* vars), with-otel owns logs, metrics, and
        Claude Code telemetry.
  instrumentation_points:
    runner_run:
      file: src/antkeeper/core/runner.py
      location: "Runner.run() method"
      span_name: "antkeeper.run"
      attributes: ["run_id", "workflow_name", "channel.type"]
      error_handling: "OTel context manager records exception on span and sets ERROR status; exception re-raised"
      code_pattern: |
        with trace.get_tracer("antkeeper").start_as_current_span(
            "antkeeper.run",
            attributes={"run_id": self.id, "workflow_name": self.workflow_name, "channel.type": self.channel.type},
        ):
    run_workflow_step:
      file: src/antkeeper/core/app.py
      location: "run_workflow() function, inside step loop"
      span_name: "antkeeper.workflow.step"
      attributes: ["run_id", "workflow_name", "step_name", "step_index", "step_total"]
      error_handling: "Same pattern — exception recorded, ERROR status set, re-raised"
      code_pattern: |
        tracer = trace.get_tracer("antkeeper")
        with tracer.start_as_current_span(
            "antkeeper.workflow.step",
            attributes={"step_name": step_name, "step_index": i, "step_total": len(steps), ...},
        ):
    llm_call:
      file: src/antkeeper/llm/claude_code.py
      location: "ClaudeCodeAgent.prompt() method"
      span_name: "antkeeper.llm.call"
      attributes_before: ["prompt_length"]
      attributes_after: ["session_id", "duration_ms", "input_tokens", "output_tokens", "total_cost_usd", "model"]
      error_handling: "Same pattern"
      context_propagation:
        method: "opentelemetry.propagate.inject() into env dict passed to subprocess.run(env=env)"
        detail: >
          Injects traceparent and tracestate into the subprocess environment so
          Claude Code receives the current trace context. Claude Code does NOT
          propagate traceparent into its own traces — its events remain on
          separate traces. The session_id attribute on the antkeeper.llm.call
          span matches attributes.session.id on Claude Code events, providing
          a join key for cross-trace correlation.
      code_pattern: |
        with trace.get_tracer("antkeeper").start_as_current_span(
            "antkeeper.llm.call",
            attributes={"prompt_length": len(prompt)},
        ) as span:
            env = os.environ.copy()
            opentelemetry.propagate.inject(env)
            # ... subprocess.run(env=env) ...
            span.set_attribute("session_id", data.get("session_id") or "")
            span.set_attribute("duration_ms", data.get("duration_ms") or 0)
  span_hierarchy:
    description: "Synchronous call chain creates automatic parent-child via contextvars"
    example: |
      antkeeper.run (root)
        └─ antkeeper.workflow.step (step_name="specify")
        │    └─ antkeeper.llm.call (primary prompt)
        │    └─ antkeeper.llm.call (extraction to haiku)
        └─ antkeeper.workflow.step (step_name="implement")
             └─ antkeeper.llm.call
  axiom_field_mapping:
    resource_attributes: >
      OTEL_RESOURCE_ATTRIBUTES flow through to antkeeper spans when
      auto-configuration succeeds. In Axiom, these land in resource.custom
      as a JSON map.
    span_attributes: >
      Antkeeper span attributes (run_id, session_id, etc.) land in
      attributes.custom in Axiom.
  cross_trace_correlation:
    description: >
      Claude Code does not propagate traceparent into its own traces.
      Antkeeper and Claude Code traces are separate. The join key is
      session_id on the antkeeper.llm.call span, which matches
      attributes.session.id on Claude Code events in Axiom.
    query_pattern: >
      To correlate: find the antkeeper.llm.call span, read its session_id
      attribute, then query Claude Code events where
      attributes.session.id matches that value.
  testing:
    file: tests/test_tracing.py
    approach: "Test-scoped TracerProvider with _InMemoryExporter; swap trace.get_tracer_provider"
    test_classes:
      - "TestRunnerRunSpan — root span existence, attributes, error recording"
      - "TestRunWorkflowSpans — step span count, attributes, hierarchy, error recording"
      - "TestLLMCallSpan — LLM span attributes, error recording"

