# Antkeeper Framework - Design Expertise
# Mental model for the antkeeper workflow engine
# Last validated: 2026-03-31 (branch: refactor/channel-verbose-control)

overview:
  name: antkeeper
  purpose: >
    Lightweight Python workflow engine. Users define handlers (workflow steps)
    via a decorator-based App, wire them to a Channel (I/O boundary), and
    execute through a Runner. Designed for composable, testable pipelines.
    Supports CLI, HTTP API, and Slack-triggered execution.
  python: ">=3.12"
  license: MIT
  build: uv (uv_build backend)
  entry_point: "antkeeper.cli:main"  # Click-based CLI (Group: cli, main=cli)
  dependencies:
    - python-dotenv (.env file loading)
    - httpx (Slack API calls, HTTP client)
    - fastapi (HTTP server framework)
    - uvicorn[standard] (ASGI server)
    - opentelemetry-api (tracing API)
    - opentelemetry-sdk (span processing and export)
    - opentelemetry-exporter-otlp-proto-http (OTLP HTTP exporter)
    - opentelemetry-distro (auto-configuration via env vars)
  dev_dependencies:
    - pytest (test)
    - ruff (lint)
    - ty (type-check)
  justfile_default: "check -> ruff, ty, test"
  justfile_recipes:
    - "sdlc prompt model='opus' — runs sdlc workflow; if prompt is a file, passes as positional arg; otherwise pipes via echo to stdin"
    - "sdlc_iso prompt model='opus' — runs sdlc_iso workflow (worktree-isolated); same file-or-stdin prompt detection"
    - "server — runs antkeeper server with default settings"
    - "check_api host port — curl POST to /webhook for healthcheck"

architecture:
  core_pattern: >
    Reducer pattern. Each workflow step receives (runner, state) and returns
    a new State dict. run_workflow folds state through a list of steps.
    State is ephemeral and never shared between workflow runs — this ensures
    thread safety (one App serves multiple concurrent workflows) and makes
    reasoning straightforward.
  layer_rules:
    - "Outer layers (channels, CLI) depend on inner layers (core). Never the reverse."
    - "Core must be truly generic — no channel-specific or domain-specific concepts."
    - "Channels own runtime type/value checks to prevent bad data reaching core."
    - "Errors generally propagate up to handlers: missing keys, failed connections, naming mistakes."
    - "Edge validation (e.g. missing CLI params) can be handled and reported only when a stack trace adds no value."
  layers:
    - name: core
      path: src/antkeeper/core/
      responsibility: >
        Framework kernel. Contains domain types, the App handler registry,
        the Runner execution engine, and the run_workflow composition helper.
      modules:
        - domain.py
        - app.py
        - runner.py

    - name: channels
      path: src/antkeeper/channels/
      responsibility: >
        I/O boundary adapters. Each channel satisfies the Channel protocol
        and owns how progress/errors are reported and what initial state is
        supplied. Channels are the seam where tests swap in doubles.
      modules:
        - cli.py    # CliChannel for command-line execution
        - api.py    # ApiChannel for HTTP API execution
        - slack.py  # SlackChannel for Slack thread-based execution

    - name: llm
      path: src/antkeeper/llm/
      responsibility: >
        LLM agent abstraction layer. Defines the Agent protocol for LLM
        interactions and provides concrete implementations (ClaudeCodeAgent).
        Handlers use agents to delegate prompts to external LLM tooling.
      modules:
        - __init__.py   # Agent protocol
        - errors.py     # AgentExecutionError
        - claude_code.py  # ClaudeCodeAgent (subprocess-based)

    - name: git
      path: src/antkeeper/git/
      responsibility: >
        Git integration layer. Provides worktree management for isolated
        workflow execution, low-level git command execution, and branch
        utilities. Handlers use git worktrees to run SDLC steps in
        separate working directories without affecting the main checkout.
      modules:
        - __init__.py     # Re-exports Worktree, WorktreeError, git_worktree, GitCommandError, execute, current, latest_commit
        - core.py         # GitCommandError exception, execute() for running git subprocess commands, latest_commit()
        - branch.py       # current() — returns name of current git branch
        - worktrees.py    # Worktree class, WorktreeError, git_worktree context manager

    - name: handlers
      path: src/antkeeper/handlers/
      responsibility: >
        Pre-built handler packages. Currently contains the claude_code subpackage,
        which provides the cc_handler factory for building LLM-backed workflow handlers.
        Users build their own App and register handlers via add_handler() or @app.handler.
      modules:
        - __init__.py
        - claude_code/__init__.py  # Re-exports cc_handler from factories.py
        - claude_code/factories.py  # cc_handler factory (fire-and-forget and JSON modes)

    - name: helpers
      path: src/antkeeper/helpers/
      responsibility: >
        Shared utility functions. Contains JSON extraction, timestamp/log-directory
        helpers, and GitHub CLI helpers for handler code.
      modules:
        - __init__.py  # Re-exports extract_json, make_timestamp, make_log_dir via __all__
        - json.py  # extract_json — finds first {…} in text, parses as JSON
        - timestamps.py  # make_timestamp — current time as YYYYMMDDHHmmss string; make_log_dir — factory returning callable (runner) -> log dir path
        - github.py  # fetch_gh_issue, build_issues_prompt — GitHub CLI helpers (NOT re-exported from helpers/__init__.py; import directly)

    - name: http
      path: src/antkeeper/http/
      responsibility: >
        HTTP endpoint logic extracted from server.py. __init__.py provides
        run_workflow_background shared helper. webhook.py exports handle_webhook
        async function. slack_events.py exports SlackEventProcessor class.
        server.py defines routes inline and delegates to these modules.
      modules:
        - __init__.py      # run_workflow_background — shared background task helper
        - webhook.py       # handle_webhook async function, WebhookRequest/Response models
        - slack_events.py  # SlackEventProcessor class with debounce timer, pending store

    - name: loader
      path: src/antkeeper/loader.py
      responsibility: >
        Shared app-loading utility. load_app(path) dynamically imports a
        Python module via importlib and returns its `app` attribute. Used by
        both cli.py and server.py. Raises FileNotFoundError if spec is None,
        AttributeError if module has no `app`.

    - name: cli
      path: src/antkeeper/cli.py
      responsibility: >
        Click-based CLI entry point. Loads a user-supplied agents file
        (Python module exporting `app`) via loader.load_app(), builds a
        CliChannel, and runs the workflow via Runner. Also provides server
        subcommand that starts uvicorn for HTTP API access.

    - name: server
      path: src/antkeeper/server.py
      responsibility: >
        FastAPI server orchestrator. Loads .env via python-dotenv, loads
        antkeeper App via loader.load_app(), creates FastAPI instance, defines
        routes inline (@api.post), and delegates logic to http/webhook.py
        (handle_webhook) and http/slack_events.py (SlackEventProcessor).
        Module-level app = create_app() for uvicorn import.

    - name: package_init
      path: src/antkeeper/__init__.py
      responsibility: >
        Package-level re-exports. Exports all major public types via __all__:
        App, Runner, run_workflow, State, Channel, WorkflowFailedError,
        CliChannel, ApiChannel, SlackChannel, Worktree, git_worktree,
        make_log_dir, make_timestamp. Note: extract_json and json_prompt are
        NOT exported here; extract_json is imported directly from
        antkeeper.helpers.json when needed. json_prompt has been removed.

    - name: package_main
      path: src/antkeeper/__main__.py
      responsibility: >
        Enables `python -m antkeeper` execution. Delegates to cli.main().

  logging: >
    File-based per-run logging via Python stdlib logging. Runner creates a
    per-run logger (antkeeper.run.<id>) writing to <app.log_dir>/<timestamp>-<id>.log.
    Module-level loggers exist in cli.py, channels/cli.py, channels/slack.py,
    llm/claude_code.py, http/slack_events.py, git/worktrees.py, and git/core.py
    for debug tracing. No console logging by default — all framework logs go to files.

  tracing: >
    OpenTelemetry spans at three instrumentation points. Each uses
    trace.get_tracer("antkeeper") directly (no singleton/wrapper module).
    (1) Runner.run() — root span "antkeeper.run" with run_id, workflow_name,
    channel.type. (2) run_workflow() — per-step child span "antkeeper.workflow.step"
    with step_name, step_index, step_total, run_id, workflow_name.
    (3) ClaudeCodeAgent.prompt() — child span "antkeeper.llm.call" with
    prompt_length (before), session_id/duration_ms/input_tokens/output_tokens/
    total_cost_usd/model (after). All spans record exceptions and set ERROR
    status on failure. Activated by wrapping commands with opentelemetry-instrument
    (e.g. opentelemetry-instrument antkeeper run ...); no-op tracer without it.
    No TracerProvider setup in library code — deployer's responsibility.
    OTel packages are core dependencies.

  state_persistence: >
    Automatic JSON-based state snapshots. Runner writes state to
    <app.state_dir>/<timestamp>-<id>.json at four points: (1) before workflow —
    initial state with run_id/workflow_name, (2) run_workflow: _progress inserted
    (completed=skip) before first step, (3) after each step — _progress.completed
    incremented, (4) after completion — final state. Log and state files share the
    same <timestamp>-<id> base name. JSON indent=2. Single direct handlers produce
    no _progress key.

domain_types:
  WorkflowFailedError:
    file: src/antkeeper/core/domain.py
    definition: "class WorkflowFailedError(Exception)"
    notes: >
      Raised by Runner.fail() to signal workflow failure. CLI catches this and
      exits with code 1. API server catches it silently (already logged by Runner).

  State:
    file: src/antkeeper/core/domain.py
    definition: "type State = dict[str, Any]"
    notes: >
      Type alias. All workflow state is a flat string-keyed dict. Handlers
      receive and return State; Runner injects run_id and workflow_name.
      Reserved keys: run_id, workflow_name, _progress (by run_workflow),
      _resume_skip (one-shot resume signal; stripped before execution, never persisted).

  StreamEvent:
    file: src/antkeeper/core/domain.py
    definition: "@dataclass class StreamEvent"
    attributes:
      - "type: str  # 'progress', 'assistant', 'tool', 'result', 'rate_limit', 'error'"
      - "content: str  # human-readable payload"
      - "metadata: dict[str, Any] | None = None  # structured data (usage, cost, rate limit)"
      - "internal: bool = False  # True for housekeeping events (e.g. extraction step)"
    methods:
      - "to_json() -> str  # serializes event to JSON string via dataclasses.asdict + json.dumps"
    notes: >
      Represents a single event from an LLM streaming response. Used as the
      unit of data flow from agents through channels. Channels suppress
      internal=True events (not shown to users). The 'result' type carries
      the final LLM response text in content plus usage/cost in metadata.
      Channels use to_json() in verbose mode to render full event details.

  Channel:
    file: src/antkeeper/core/domain.py
    definition: Protocol
    attributes:
      - "type: str"
      - "workflow_name: str"
      - "initial_state: State"
    methods:
      - "report(run_id: str, event: StreamEvent) -> None"
    notes: >
      Structural (duck-typed) protocol. Single report() method replaces the
      previous report_progress/report_error pair. Channels suppress
      internal=True events. Error events (event.type == 'error') route to
      stderr; all others to stdout. This is the primary extension point for
      new I/O adapters.

core_objects:
  App:
    file: src/antkeeper/core/app.py
    responsibility: Handler registry keyed by function name.
    construction: "App(log_dir: str | Callable[[Runner], str] = 'agents/logs/', worktree_dir: str = 'trees/', state_dir: str = '.antkeeper/state/', env: dict[str, Any | Callable[[Runner], Any]] | None = None, handlers: dict[str, Callable] | None = None)"
    attributes:
      - "handlers: dict  # name -> fn mapping"
      - "log_dir: str | Callable[[Runner], str]  # directory for per-run log files, or a callable accepting (runner) that returns the path"
      - "worktree_dir: str  # directory for git worktrees"
      - "state_dir: str  # directory for per-run state JSON files"
      - "env: dict[str, Any | Callable[[Runner], Any]] | None  # optional env vars; values may be callables accepting (runner) returning the value"
    interface:
      - "handler(fn) -> wrapper  # decorator that registers fn by fn.__name__"
      - "add_handler(fn) -> None  # programmatic alternative to @app.handler decorator"
      - "get_handler(name) -> Callable[[Runner, State], State | NoReturn]"
    design_constraint: >
      get_handler raises ValueError for unknown names. The decorator and add_handler()
      both store the original fn in self.handlers. handlers constructor param merges
      pre-registered handlers at construction time. log_dir can be a callable accepting
      (runner) — resolved by Runner.__init__ at construction time. env values can be
      callables accepting (runner) — resolved by Runner.run() before passing to _app_env.
      Callable resolution happens per-run so values like runner.id are available. env consumed
      by Runner.run() via _app_env — not applied by App itself. env vars are process-global;
      concurrent Runner instances could conflict (acceptable for single-threaded model).

  _app_env:
    file: src/antkeeper/core/app.py
    signature: "_app_env(env: dict[str, Any] | None) -> Generator[None]"
    kind: contextmanager (module-level, private)
    responsibility: >
      Temporarily injects env vars into os.environ for the duration of a with-block,
      then restores original values in a finally block. No-op if env is None or {}.
      Values are converted via str() before being set. Keys absent from os.environ
      before the block are deleted (not set to None) on restore. Callable env values
      are already resolved by Runner.run() before _app_env is called — _app_env only
      sees plain values. Not exported from __init__.py — implementation detail.
    behavior: "No-op if env is None/empty. Sets each via str(v). Restores or pops on exit (finally)."

  Runner:
    file: src/antkeeper/core/runner.py
    responsibility: >
      Execution engine. Binds an App + Channel, generates a run id, sets up
      per-run file logging, and drives the workflow lifecycle.
    construction: "Runner(app: App, channel: Channel)"
    attributes:
      - "id: str  # uuid4 hex[:8]"
      - "channel: Channel"
      - "app: App"
      - "logger: logging.Logger  # per-run file logger (antkeeper.run.<id>)"
      - "_state_path: str  # absolute path to per-run state JSON file"
    interface:
      - "run() -> State  # merges channel.initial_state with run_id/workflow_name, persists state before workflow, calls workflow, persists final state after"
      - "_persist_state(state: State) -> None  # writes state dict to _state_path as formatted JSON"
      - "workflow_name: property  # delegates to channel.workflow_name"
      - "workflow: property  # resolves handler via app.get_handler(workflow_name)"
      - "report_progress(message) -> None  # logs then delegates to channel"
      - "report_error(message) -> None  # logs then delegates to channel"
      - "fail(message) -> NoReturn  # logs, raises WorkflowFailedError"
    design_constraint: >
      Runner.__init__ resolves app.log_dir (callable or string), creates log dir
      and state dir, sets up FileHandler (<log_dir>/<ts>-<id>.log), state file at
      <state_dir>/<ts>-<id>.json. Logger propagate=False. run() resolves callable
      env values before _app_env; persists initial state before workflow; run_workflow
      persists _progress before first step and after each step; run() persists once
      more after completion. fail() raises WorkflowFailedError (not exit(1)).

  run_workflow:
    file: src/antkeeper/core/app.py
    signature: "run_workflow(runner: Runner, state: State, steps: list[Callable], skip: int = 0) -> State"
    responsibility: >
      Sequential composition helper. Folds state through a list of handler
      callables. Logs step names and completion via runner.logger.
    progress_tracking: >
      Before the first step, inserts _progress: {"total": len(steps), "completed": skip}
      into state and immediately calls runner._persist_state(). External observers can
      read total step count immediately. After each step, increments _progress.completed
      by 1 and persists. The _progress key is part of the returned state. Single direct
      handler invocations (not using run_workflow) produce no _progress key.
    resume_support: >
      When skip > 0, first skip steps are not executed and _progress["completed"] starts
      at skip. If skip == 0 and state contains _resume_skip, that value is used instead.
      _resume_skip is always stripped from state before execution (never persisted or
      visible to handlers). This is a one-shot signal set by the CLI resume command.
    persistence_order:
      - "1. Strip _resume_skip, resolve effective skip"
      - "2. Insert _progress (completed=skip) + persist (before first step)"
      - "3. Execute step (only steps[skip:])"
      - "4. Increment _progress.completed + persist (after each step)"
      - "5. Return final state (Runner.run() persists once more)"

git_objects:
  GitCommandError:
    file: src/antkeeper/git/core.py
    definition: "class GitCommandError(Exception)"
    notes: >
      Raised when a git subprocess command exits with non-zero status.
      Carries stderr output as the error message. Used by execute() and
      indirectly by branch.current().

  execute:
    file: src/antkeeper/git/core.py
    signature: "execute(cmd: list[str]) -> str"
    responsibility: >
      Low-level git command runner. Accepts a command list with or without
      the "git" prefix — auto-prepends "git" if missing (both ["status"]
      and ["git", "status"] are valid). Runs via subprocess.run with
      capture_output=True, returns stripped stdout on success, raises
      GitCommandError with stderr on non-zero exit. Logging via
      module-level logger (antkeeper.git.core).

  latest_commit:
    file: src/antkeeper/git/core.py
    signature: "latest_commit() -> dict"
    responsibility: >
      Returns {"sha": str, "message": str} for the most recent commit.
      Uses unit-separator delimiter (\x1f) to safely parse commit messages
      containing quotes or special characters. Re-exported from git/__init__.py.

  current:
    file: src/antkeeper/git/branch.py
    signature: "current() -> str"
    responsibility: >
      Returns the name of the current git branch. Delegates to
      execute(["git", "rev-parse", "--abbrev-ref", "HEAD"]). Returns
      "HEAD" when in detached HEAD state.

  WorktreeError:
    file: src/antkeeper/git/worktrees.py
    definition: "class WorktreeError(Exception)"
    notes: >
      Raised when a git worktree operation fails (create, remove, or
      entering a non-existent worktree).

  Worktree:
    file: src/antkeeper/git/worktrees.py
    responsibility: >
      Represents a git worktree on disk. Wraps git worktree subprocess
      operations for creating and removing worktrees.
    construction: "Worktree(base_dir: str, name: str)"
    attributes:
      - "base_dir: str  # absolute path to the directory containing worktrees"
      - "name: str  # worktree subdirectory name"
      - "path: str  # absolute path (realpath of base_dir/name)"
    interface:
      - "exists: property -> bool  # checks os.path.isdir(self.path)"
      - "create(branch: str | None = None) -> None  # git worktree add, creates base_dir if needed"
      - "remove() -> None  # git worktree remove"
    design_constraint: "Paths resolved via realpath. create() uses makedirs(exist_ok=True). Both create/remove raise WorktreeError on non-zero exit." 

  git_worktree:
    file: src/antkeeper/git/worktrees.py
    signature: "git_worktree(worktree, *, create=False, branch=None, remove=False) -> Generator[Worktree]"
    responsibility: >
      Context manager entering a git worktree. Guarantees cwd restoration (try/finally).
    behavior: "entry: create=True -> worktree.create(branch); create=False+not exists -> WorktreeError. Saves cwd, chdir. exit: restore cwd always. remove=True -> worktree.remove(). yields Worktree." 

llm_types:
  Agent:
    file: src/antkeeper/llm/__init__.py
    definition: Protocol
    methods:
      - "prompt(prompt: str) -> Iterator[StreamEvent]"
    notes: >
      Structural protocol for LLM agents. Any object with a prompt() method
      qualifies. prompt() now yields StreamEvents (streaming). This is the
      extension point for adding new LLM backends.

  AgentExecutionError:
    file: src/antkeeper/llm/errors.py
    definition: "class AgentExecutionError(Exception)"
    notes: >
      Raised when an agent fails to execute a prompt (non-zero exit,
      missing binary, etc.).

  ClaudeCodeAgent:
    file: src/antkeeper/llm/claude_code.py
    satisfies: Agent protocol
    construction: "ClaudeCodeAgent(model: str | None = None, yolo: bool = False, opts: list[str] | None = None)"
    attributes:
      - "model: str | None  # model identifier for --model flag"
      - "yolo: bool  # when True, passes --dangerously-skip-permissions"
      - "opts: list[str] | None  # extra CLI args; override convenience params when flags conflict"
    behavior:
      prompt: >
        Builds command: ['claude'] + [--model model] (if model set and not in opts)
        + [--dangerously-skip-permissions] (if yolo and not in opts)
        + [--output-format stream-json] (if not in opts) + [--verbose] (if not in opts)
        + opts + ['-p', prompt].
        Runs via subprocess.Popen, reads stdout line-by-line via _parse_jsonl_line().
        Yields StreamEvent instances. 'result' events include metadata (session_id,
        duration_ms, usage, total_cost_usd, model). Telemetry set on OTel span via
        _set_span_telemetry(). Logs prompt/response lengths at INFO, full content at DEBUG.
        span is a standalone span (not using start_as_current_span) with OTel context
        propagated via inject() into subprocess env.
      errors:
        - "Non-zero exit -> AgentExecutionError with stderr (after stdout drained)"
        - "Missing binary -> AgentExecutionError('claude binary not found')"
        - "Malformed JSONL line -> ValueError('Malformed JSONL line: ...')"
    private_functions:
      _parse_jsonl_line: >
        _parse_jsonl_line(line: str) -> StreamEvent | None.
        Maps JSONL event types: 'assistant' -> StreamEvent(assistant), 'system' -> StreamEvent(tool),
        'result' -> StreamEvent(result, metadata), 'rate_limit' -> StreamEvent(rate_limit, metadata).
        Returns None for unknown types. Raises ValueError on malformed JSON.
      _set_span_telemetry: >
        _set_span_telemetry(span, metadata) -> None.
        Sets session_id, duration_ms, input_tokens, output_tokens, total_cost_usd, model
        attributes on the active span from result event metadata. No-op if metadata is None.

  run_prompt:
    file: src/antkeeper/llm/claude_code.py
    signature: "run_prompt(prompt: str, logger: logging.Logger, model: str | None = None, opts: list[str] | None = None) -> Iterator[StreamEvent]"
    kind: module-level convenience function
    responsibility: >
      Creates a ClaudeCodeAgent(model=model, yolo=True, opts=opts), calls agent.prompt(),
      returns the event iterator. The standard way handlers invoke the LLM.
      Not exported from antkeeper/__init__.py; imported directly from antkeeper.llm.claude_code.

helper_functions:
  fetch_gh_issue:
    file: src/antkeeper/helpers/github.py
    signature: "fetch_gh_issue(issue_number: int) -> dict"
    responsibility: >
      Fetches a GitHub issue via gh CLI (issue view --json number,title,body,comments,labels,state).
      Returns parsed JSON dict. Raises FileNotFoundError if gh not installed,
      CalledProcessError on gh failure, JSONDecodeError on invalid response.
      NOT re-exported from helpers/__init__.py; import directly.

  build_issues_prompt:
    file: src/antkeeper/helpers/github.py
    signature: "build_issues_prompt(issues: list[dict]) -> str"
    responsibility: >
      Formats a list of issue dicts (from fetch_gh_issue) into a prompt string.
      Header line + per-issue separator "--- Issue #N ---" + JSON indent=2 + trailing newlines.
      Used by handlers that orchestrate fix-gh-issues-style workflows.

  extract_json:
    file: src/antkeeper/helpers/json.py
    signature: "extract_json(text: str) -> dict"
    responsibility: >
      Finds first '{' and last '}' in text, extracts substring, parses as JSON.
      Raises ValueError if no braces found or JSON is invalid. Handles LLM
      responses wrapped in markdown code fences or prose. Used by cc_handler
      extraction step to parse the haiku response.

  make_timestamp:
    file: src/antkeeper/helpers/timestamps.py
    signature: "make_timestamp() -> str"
    responsibility: >
      Returns current time as a 14-character YYYYMMDDHHmmss string using
      datetime.now().strftime. Re-exported from antkeeper/__init__.py and
      antkeeper/helpers/__init__.py.

  make_log_dir:
    file: src/antkeeper/helpers/timestamps.py
    signature: "make_log_dir(base_dir: str) -> Callable[[Runner], str]"
    responsibility: >
      Factory that returns a callable compatible with App(log_dir=...).
      The returned callable accepts a Runner and produces
      "{base_dir}/{make_timestamp()}-{runner.id}/". Timestamp is captured
      at invocation time (not factory time). Re-exported from antkeeper/__init__.py
      and antkeeper/helpers/__init__.py.

handler_factories:
  cc_handler:
    file: src/antkeeper/handlers/claude_code/factories.py
    signature: "cc_handler(command: str, *, state_updates: list[str] | None = None, label: str | None = None, model: str | None = None, env: dict[str, str] | None = None, opts: list[str] | None = None, yolo: bool = True) -> Handler"
    returns: "Handler Protocol — callable (Runner, State) -> State with __name__ attribute"
    responsibility: >
      Factory producing (Runner, State) -> State handler functions in two modes:
      fire-and-forget (state_updates absent/empty) and extraction mode (state_updates non-empty).
    constants:
      _EXTRACTION_MODEL: "haiku — always used for extraction step"
    types:
      Middleware: "Callable[[Iterator[StreamEvent]], Iterator[StreamEvent]]"
    module_functions:
      build_pipeline: >
        build_pipeline(stream, middlewares) -> Iterator[StreamEvent].
        Chains middlewares left-to-right. Empty list = identity pass-through.
      _extraction_prompt: >
        _extraction_prompt(response, *, required_fields) -> str.
        Prompts extraction model to return JSON with required_fields (null if absent).
      _extraction_middleware: >
        _extraction_middleware(required_fields, log, model_opts) -> Middleware.
        Intercepts result events; runs second run_prompt (extraction prompt);
        yields extraction events with internal=True after original result event.
        Non-result events pass through. model_opts = (_EXTRACTION_MODEL, ["--max-turns", "1"]).

    behavior:
      label_derivation: "Default label = first token of command with leading slash stripped."
      handler.__name__: "Set to label for framework introspection (app.add_handler() compatible)."
      interpolation: >
        $var placeholders substituted from state via regex. ${var} NOT interpolated.
        Missing state key -> KeyError -> runner.fail().
      fire_and_forget_mode: >
        state_updates None/empty: streams agent.prompt() through empty pipeline,
        forwards all events directly to runner.channel.report(). Returns state unchanged.
      extraction_mode: >
        state_updates non-empty: pipeline with _extraction_middleware (haiku, --max-turns 1).
        All events forwarded directly to runner.channel.report(). Internal result events
        parsed via extract_json. Extracted fields merged into state. Missing field -> KeyError -> runner.fail().
      streaming: >
        Handler drains pipeline event-by-event, forwarding all events to runner.channel.report().
        Verbosity filtering is now the channel's responsibility (verbose param on CliChannel,
        ApiChannel, SlackChannel). Pipeline closed in finally.
      model_resolution: >
        Primary: model if not None else state.get("model"). Factory model beats state model.
        Extraction: always haiku with --max-turns 1.
      error_handling: >
        KeyError, AgentExecutionError, ValueError all route to runner.fail("{label} failed: {error}").
      env_handling: >
        env provided -> handler body executes inside _app_env(env). Handler env wins over
        App-level env. Static str only. env=None is a no-op.
      opts_handling: >
        opts forwarded verbatim to ClaudeCodeAgent. None (default) = no extra flags.
        opts=[] forwarded as-is. Handler opts are NOT passed to the extraction step;
        extraction always uses its own hardcoded ["--max-turns", "1"].
      yolo_handling: >
        yolo=True (default) passes --dangerously-skip-permissions to ClaudeCodeAgent.
        yolo=False omits the flag. Backward compatible: all existing calls default to True.
      progress: "Reports Running {label} before and {label} complete after."
  handlers_package_exports:
    file: src/antkeeper/handlers/claude_code/__init__.py
    purpose: >
      Re-exports cc_handler from factories.py. No App instance or pre-registered
      handlers — users build their own App and register handlers via add_handler()
      or the @app.handler decorator.
    exports: ["cc_handler"]

channel_implementations:
  CliChannel:
    file: src/antkeeper/channels/cli.py
    satisfies: Channel protocol
    construction: "CliChannel(workflow_name: str, initial_state: dict[str,str] | None = None, *, verbose: bool = False)"
    behavior:
      type: '"cli"'
      initial_state: "Copies input dict or defaults to {}"
      report: >
        Suppresses internal=True events and empty content. Default (verbose=False): only
        'progress' and 'error' events printed as plain text. verbose=True: all non-internal
        events printed as JSON (event.to_json()). Prints to stdout or stderr (error type).

  ApiChannel:
    file: src/antkeeper/channels/api.py
    satisfies: Channel protocol
    construction: "ApiChannel(workflow_name: str, initial_state: dict[str,str] | None = None, *, verbose: bool = False)"
    behavior:
      type: '"api"'
      initial_state: "Copies input dict or defaults to {}"
      report: >
        Identical to CliChannel.report(). Default (verbose=False): only 'progress' and 'error'
        events as plain text. verbose=True: all non-internal events as JSON (event.to_json()).
    notes: >
      Identical to CliChannel except type="api". Both use flush=True.
      Designed for FastAPI server where output goes to Uvicorn logs.

  SlackChannel:
    file: src/antkeeper/channels/slack.py
    satisfies: Channel protocol
    construction: "SlackChannel(workflow_name: str, initial_state: State | None = None, *, slack_token: str, channel_id: str, thread_ts: str, verbose: bool = False)"
    behavior:
      type: '"slack"'
      initial_state: "Copies input dict or defaults to {}"
      report: >
        Suppresses internal=True events and empty content. Default (verbose=False): only
        'progress' and 'error' events posted as plain text. verbose=True: all non-internal
        events posted. Always renders as plain text (no JSON rendering unlike CLI/API).
        Error events include [ERROR] prefix. HTTP errors caught and logged, never raised.
    design_constraint: >
      Uses sync httpx.Client (not async) because handlers run in threadpool
      via asyncio.to_thread. Slack failures must not crash the workflow. Thread context
      (channel_id, thread_ts) captured at construction from the original @mention event.

cli_entry_point:
  file: src/antkeeper/cli.py
  shared_functions:
    - "parse_state_pairs(pairs: list[str]) -> dict[str, str]  # splits key=val strings"
    - "_run_workflow_cli(agents_file, workflow_name, state) -> None  # calls load_app(), creates CliChannel+Runner, runs, handles errors"
    - "_load_state_by_run_id(state_dir: str, run_id: str) -> tuple[dict, str]  # globs state_dir for *-{run_id}.json, returns (state, path); raises FileNotFoundError if none"
  note: "load_app moved to src/antkeeper/loader.py; fetch_gh_issue and build_issues_prompt moved to src/antkeeper/helpers/github.py"
  subcommands:
    run:
      framework: Click (@cli.command)
      args:
        - "--agents-file (default: handlers.py) — path to Python module exporting `app`"
        - "--initial-state key=val (repeatable) — seed state pairs"
        - "--model — model identifier, stored as state['model']"
        - "workflow_name (positional) — workflow name to invoke"
        - "prompt_files (nargs=-1) — file paths whose contents are concatenated into state['prompt']"
      prompt_resolution: >
        If prompt_files given, reads each via Path.read_text() and concatenates
        into state['prompt']. If no files and stdin is piped (!sys.stdin.isatty()),
        reads stdin into state['prompt']. If neither, no prompt is set.
      flow: >
        1. parse_state_pairs() splits key=val strings into dict
        2. If prompt_files: reads and concatenates into state['prompt']
        3. Else if stdin piped: reads stdin into state['prompt']
        4. Merges --model into state if provided
        5. Delegates to _run_workflow_cli(agents_file, workflow_name, state)
      error_handling:
        - "FileNotFoundError -> agents file not found"
        - "AttributeError -> agents file has no 'app'"
        - "FileNotFoundError -> prompt file not found (positional arg)"
        - "Invalid state pair (no '=') -> stderr + exit(1)"
        - "WorkflowFailedError -> stderr + exit(1)"

    resume:
      framework: Click (@cli.command)
      args:
        - "--agents-file (default: handlers.py)"
        - "run_id (positional) — 8-char hex from the interrupted run"
      flow: >
        load_app -> _load_state_by_run_id -> validate workflow_name, _progress, completed<total
        -> state["_resume_skip"]=completed -> CliChannel+Runner -> run_workflow consumes _resume_skip
      error_handling:
        - "Agents file not found / no app / state file not found / no workflow_name / no _progress / already completed -> stderr + exit(1)"
        - "WorkflowFailedError -> stderr + exit(1)"
      design_note: "Resume always creates a new Runner. _resume_skip flows via initial_state into run_workflow."

    server:
      framework: Click (@cli.command)
      args:
        - "--host (default: 127.0.0.1) — uvicorn bind host"
        - "--port (default: 8000) — uvicorn bind port"
        - "--reload (flag) — enable uvicorn auto-reload"
        - "--agents-file (default: handlers.py) — path to Python module exporting `app`"
      flow: >
        1. Sets ANTKEEPER_HANDLERS_FILE environment variable to args.agents_file
        2. Calls uvicorn.run("antkeeper.server:app", host, port, reload)
        3. Uvicorn imports antkeeper.server module and loads the app object
      notes: "--agents-file propagated via ANTKEEPER_HANDLERS_FILE env var (uvicorn imports module string)."

    init:
      framework: Click (@cli.command)
      args:
        - "path (positional, optional, default: '.') — directory to create handlers.py in"
      flow: >
        1. Resolves path via os.path.realpath
        2. Checks if handlers.py already exists at target (exits 1 if so)
        3. Writes HANDLERS_TEMPLATE to target/handlers.py
        4. Prints success message with usage instructions (run, server, env vars)
      error_handling:
        - "handlers.py already exists -> stderr + exit(1)"
        - "Directory does not exist (FileNotFoundError) -> stderr + exit(1)"
        - "No write permission (PermissionError) -> stderr + exit(1)"
      template: "HANDLERS_TEMPLATE module-level constant: starter handlers.py with imports, App(), healthcheck handler, commented examples."

  no_subcommand: "Click group with invoke_without_command=True — prints help and exits 0 if no subcommand"

server_module:
  file: src/antkeeper/server.py
  purpose: >
    FastAPI server orchestrator. Loads .env, loads antkeeper App, creates
    FastAPI, defines routes inline, delegates logic to http/ package.
  functions:
    create_app:
      signature: "create_app(agents_file: str = os.environ.get('ANTKEEPER_HANDLERS_FILE', 'handlers.py')) -> FastAPI"
      responsibility: >
        1. dotenv.load_dotenv()
        2. loader.load_app(agents_file) -> antkeeper App
        3. Creates FastAPI + SlackEventProcessor(antkeeper_app)
        4. Defines @api.post("/webhook") -> delegates to handle_webhook
        5. Defines @api.post("/slack_event") -> env var guard + delegates to slack.handle_event
        6. Returns configured FastAPI
      slack_event_env_guard: >
        Before delegating to SlackEventProcessor, the /slack_event route validates
        SLACK_BOT_TOKEN and SLACK_BOT_USER_ID are present and non-empty. Raises
        HTTPException(422) listing missing vars. url_verification requests bypass
        this guard (Slack sends these during initial app setup before tokens exist).
  module_level:
    app: "app = create_app()  # Default instance for uvicorn to import"

http_modules:
  init:
    file: src/antkeeper/http/__init__.py
    function: "run_workflow_background(runner: Runner) -> None"
    behavior: >
      Shared background task helper. Catches WorkflowFailedError silently,
      logs unexpected errors to stderr. Imported by webhook.py and
      slack_events.py.

  webhook:
    file: src/antkeeper/http/webhook.py
    types:
      WebhookRequest: "pydantic.BaseModel — workflow_name: str, initial_state: dict[str, Any] = {}"
      WebhookResponse: "pydantic.BaseModel — run_id: str"
    function: "async handle_webhook(request: WebhookRequest, background_tasks: BackgroundTasks, antkeeper_app: App) -> WebhookResponse"
    behavior: >
      Validates workflow via get_handler (404 if missing), creates
      ApiChannel + Runner, schedules run_workflow_background as background
      task, returns WebhookResponse with run_id. Called from server.py
      route handler.

  slack_events:
    file: src/antkeeper/http/slack_events.py
    helpers:
      - "is_bot_message(event) -> bool  # checks event.get('bot_id')"
      - "is_bot_mention(text, bot_user_id) -> bool  # checks <@BOT_ID> in text"
      - "strip_mention(text) -> str  # regex removes leading <@U...> mention"
    types:
      PendingMessage:
        kind: dataclass
        fields: "channel_id, ts, user, text, files: list[dict], workflow_name, timer_task: asyncio.Task | None"
    async_helpers:
      slack_api: "async slack_api(token, method, payload) -> dict  # httpx.AsyncClient POST to Slack API"
    class: SlackEventProcessor
    construction: "SlackEventProcessor(antkeeper_app: App)"
    attributes:
      - "_app: App  # antkeeper app with registered handlers"
      - "_pending: dict[tuple[str, str], PendingMessage]  # instance-scoped pending store"
    methods:
      - "async handle_event(body: dict) -> dict  # main event router"
      - "async _handle_thread_reply(event, channel_id, event_ts, token, cooldown) -> dict"
      - "async _handle_edit(event, channel_id, token, cooldown) -> dict"
      - "_handle_delete(event, channel_id) -> dict  # sync method"
      - "async _handle_mention(event, channel_id, event_ts, bot_user_id, token, cooldown) -> dict"
      - "async _on_timer_fire(key, token, cooldown) -> None  # debounce timer callback"
    env_vars:
      - "SLACK_BOT_TOKEN — Slack bot OAuth token"
      - "SLACK_BOT_USER_ID — Slack user ID for mention detection"
      - "SLACK_COOLDOWN_SECONDS — debounce timer seconds (default: 30)"
      - "ANTKEEPER_SLACK_VERBOSE — when '1' or 'true' (case-insensitive), sets verbose=True on SlackChannel created by _on_timer_fire"
    routing_order:
      - "url_verification -> return challenge"
      - "no event -> 200"
      - "bot self-filter (bot_id) -> 200"
      - "thread reply (thread_ts != ts, parent in pending) -> cancel timer, append text/files, restart timer, add reaction"
      - "message_changed -> update pending text, restart timer"
      - "message_deleted -> cancel timer, remove pending"
      - "bot mention (app_mention or message with subtype None or file_share, containing <@BOT>) -> create PendingMessage, add thumbsup reaction, start debounce timer"
      - "all other -> 200"
    debounce_timer:
      behavior: >
        _on_timer_fire: sleeps for cooldown, pops entry from pending,
        posts "Processing your request..." in thread, validates workflow exists (posts
        error if not), builds initial_state {prompt, slack_user, files?},
        creates SlackChannel + Runner, runs via
        asyncio.to_thread(run_workflow_background, runner).
    design_constraint: >
      Pending store is instance-scoped on SlackEventProcessor for test
      isolation. Cooldown=0 in tests for deterministic timers. No thread
      safety concerns — pending accessed only from async handlers on
      single-threaded event loop. (channel_id, ts) key naturally
      deduplicates app_mention + message events.

data_flow:
  cli_happy_path:
    - "CLI parses args -> loads agents file -> gets App"
    - "Builds CliChannel(workflow_name, initial_state)"
    - "Runner(app, channel).run() — creates log file, generates run id"
    - "Runner merges initial_state + {run_id, workflow_name}"
    - "Handler(runner, state) -> new State"
    - "For composites: run_workflow folds state through sub-handlers"
    - "Result state printed to stdout"
  api_happy_path:
    - "POST /webhook with {workflow_name, initial_state} JSON body"
    - "Server validates workflow exists via app.get_handler()"
    - "Creates ApiChannel(workflow_name, initial_state)"
    - "Creates Runner(app, channel) — generates run_id"
    - "Schedules run_workflow_background(runner) as FastAPI background task"
    - "Returns {run_id} JSON response immediately (200)"
    - "Background task calls runner.run() -> workflow executes asynchronously"
    - "Progress/error output goes to Uvicorn logs (stdout/stderr)"
  llm_path:
    - "cc_handler factory builds handler with command, state_updates, label, model captured in closure"
    - "Handler interpolates $var placeholders from state via regex"
    - "Step 1: Calls run_prompt(interpolated_command, runner.logger, model=primary_model)"
    - "run_prompt creates ClaudeCodeAgent(model=model, yolo=True), calls agent.prompt()"
    - "Agent runs subprocess `claude --output-format stream-json -p` -> reads JSONL line-by-line, yields StreamEvent instances"
    - "If fire-and-forget (no state_updates): returns state unchanged"
    - "If extraction mode (state_updates non-empty): Step 2 — calls run_prompt(_extraction_prompt(response, required_fields=state_updates), runner.logger, model='haiku')"
    - "extract_json parses extraction response, picks only listed fields, merges into state"
  worktree_iso_path:
    - "sdlc_iso calls derive_feature to get feature_type and slug"
    - "Creates Worktree(base_dir=runner.app.worktree_dir, name='{timestamp}-{run_id}')"
    - "Enters git_worktree(wt, create=True, branch='{feature_type}/{slug}', remove=False)"
    - "Inside worktree: runs specify -> implement -> document via run_workflow; cwd restored on exit"
    - "Returns state with worktree_path and branch_name added"
  slack_happy_path:
    - "User @mentions bot in Slack channel with workflow name"
    - "POST /slack_event validates SLACK_BOT_TOKEN + SLACK_BOT_USER_ID (422 if missing, url_verification exempt)"
    - "POST /slack_event receives event_callback, bot filters + mention detection"
    - "Creates PendingMessage, adds thumbsup reaction, starts debounce timer"
    - "User can edit message or reply in thread — timer resets, text/files accumulated"
    - "Timer fires after cooldown — posts 'Processing your request...' in thread"
    - "Validates workflow exists, builds initial_state {prompt, slack_user, files?}"
    - "Creates SlackChannel(workflow_name, initial_state, token, channel_id, thread_ts)"
    - "Creates Runner(app, channel), runs via asyncio.to_thread(run_workflow_background)"
    - "Handler calls runner.report_progress() -> SlackChannel posts to Slack thread"
  error_path:
    - "Unknown handler -> ValueError from App.get_handler"
    - "Handler calls runner.fail(msg) -> logs, raises WorkflowFailedError"
    - "CLI catches WorkflowFailedError -> prints to stderr, exit(1)"
    - "API catches WorkflowFailedError -> logs only (already logged by Runner), continues serving"
    - "Handler calls runner.report_error(msg) -> logs, channel.report_error -> stderr"
    - "Agent subprocess failure -> AgentExecutionError propagates"
    - "Workflow exception -> Runner logs error, re-raises"
    - "Worktree creation failure -> WorktreeError propagates"
    - "Entering non-existent worktree (create=False) -> WorktreeError"
    - "Git command failure -> GitCommandError propagates (from execute())"
    - "API unknown workflow -> HTTPException 404 before creating Runner"
    - "API invalid request body -> FastAPI auto-returns 422"
    - "Slack missing env vars -> HTTPException 422 from route handler (url_verification exempt)"

testing_design:
  philosophy: >
    Test the framework, not app logic. Each test owns its setup. Replace
    I/O at the channel boundary with capturing doubles.
  test_channel:
    file: tests/conftest.py
    class: TestChannel
    satisfies: Channel protocol (duck-typed)
    captures:
      - "progress_messages: list[str]  # non-error event content"
      - "error_messages: list[str]  # error event content"
      - "events: list[StreamEvent]  # all events; report() routes error type to error_messages, rest to progress_messages"
  fixtures:
    app:
      signature: "() -> App"
      notes: "Creates App with log_dir, worktree_dir, and state_dir each set to separate tempfile.mkdtemp() directories"
    runner_factory:
      signature: "(test_app=None, workflow_name='test', initial_state=None) -> (Runner, TestChannel)"
      notes: "Uses injected app fixture by default; test_app overrides if provided"
    git_repo:
      file: tests/git/conftest.py
      signature: "() -> str (yields repo path)"
      notes: >
        Creates a temporary git repo with init commit, sets cwd to repo dir.
        Restores original cwd on teardown. Used by all git integration tests.
  test_structure: >
    Tests organized into subdirectories mirroring src layout.
  test_files:
    - tests/core/test_app.py — App constructor tests (handlers param, add_handler, env param storage and defaults)
    - tests/core/test_workflows.py — core engine paths + TestAppEnvironment (env var lifecycle, callable env values) + TestWorkflowProgress (_progress tracking, initial persist before first step, no _progress for direct handlers) + TestCallableLogDir (callable log_dir)
    - tests/core/test_logging.py — per-run file logging, App config (log_dir, worktree_dir, state_dir defaults)
    - tests/core/test_state_persistence.py — state file creation, naming format, content, per-step persistence, log/state filename correlation
    - tests/channels/test_cli_channel.py — CliChannel initial_state and attribute tests
    - tests/channels/test_api_channel.py — ApiChannel type, initial_state, stdout/stderr reporting
    - tests/test_cli.py — Click CLI: TestParseStatePairs (empty, valid, invalid), TestRunCommand (agent loading, prompt file/stdin, state/model), TestResumeCommand, TestServerCommand, TestInitCommand
    - tests/core/test_resume.py — TestLoadStateByRunId (finds matching file, raises FileNotFoundError when absent, picks correct file among multiple)
    - tests/test_server.py — FastAPI webhook endpoint (returns run_id, 404 for unknown workflow, 422 for invalid body)
    - tests/channels/test_slack_channel.py — SlackChannel type, initial_state, report_progress/error posts, HTTP failure resilience
    - tests/test_slack_server.py — Slack event endpoint (url_verification, bot filter, mention, edit, reply, delete, timer dispatch, unknown workflow, dedup, env var validation)
    - tests/llm/test_claude_code_agent.py — ClaudeCodeAgent: subprocess delegation via Popen, model/yolo/opts flags, missing binary -> AgentExecutionError, stream-json output format, JSONL line parsing via _parse_jsonl_line (assistant/system/result/rate_limit/unknown types), result event metadata/telemetry, non-zero exit after stream raises AgentExecutionError
    - tests/llm/test_middleware.py — build_pipeline (identity, single mw, sequential order), _extraction_middleware (intercepts result, splices internal events, passes non-result events, error propagation)
    - tests/helpers/test_extract_json.py — JSON extraction from LLM responses
    - tests/helpers/test_timestamps.py — make_timestamp format, make_log_dir returns callable, produces correct path, timestamp captured at call time
    - tests/git/test_worktree.py — Worktree class (path, exists, create, create+branch, remove, errors)
    - tests/git/test_context.py — git_worktree context manager (create, cwd, yield, restore, remove)
    - tests/git/test_core.py — execute() stdout capture, GitCommandError on failure, empty output handling
    - tests/git/test_branch.py — current() default branch, switched branch, detached HEAD state
    - tests/handlers/test_factories.py — cc_handler: label derivation, streaming pipeline, extraction mode (haiku + max-turns 1), fire-and-forget mode, $var interpolation (${var} NOT interpolated), model override (factory beats state), error handling (KeyError/AgentExecutionError/ValueError -> runner.fail), handler-level env (set/restore), opts forwarded to agent (empty list as-is, extraction isolation), yolo default True + yolo=False forwarding; all events forwarded to channel (verbosity is channel's concern)
    - tests/test_tracing.py — OTel tracing: test-scoped TracerProvider with _InMemoryExporter, TestRunnerRunSpan (root span attributes, error recording), TestRunWorkflowSpans (step spans, hierarchy, error recording), TestLLMCallSpan (LLM call span attributes, error recording)
    - tests/llm/test_run_prompt.py — run_prompt: returns Iterator[StreamEvent], delegates to ClaudeCodeAgent with yolo=True, passes model/opts
    - tests/core/test_loader.py — TestLoadApp: returns app object, FileNotFoundError on missing file, AttributeError on missing app attr
    - tests/helpers/test_github.py — TestFetchGhIssue (gh subprocess, errors), TestBuildIssuesPrompt (single/multi issue format)

key_design_decisions:
  - >
    Channel is a Protocol, not an ABC. Extensions use structural subtyping.
    Channel.report(run_id, StreamEvent) is the single reporting method; the previous
    report_progress/report_error pair was unified into report() with event.type routing.
  - >
    Handlers receive (runner, state) and return State. Runner is the only
    framework object a handler interacts with.
  - >
    State is always a new dict (spread pattern). No mutation of incoming state.
    State is automatically persisted to JSON files during workflow execution
    (before, after each step, and on completion) but is never shared between
    workflow runs — each run writes its own isolated state file.
  - >
    run_workflow enables composition without inheritance or a DAG scheduler.
    Handlers that orchestrate other handlers just call run_workflow with a
    step list.
  - >
    The CLI dynamically loads user code via importlib. The agents file must
    export a module-level `app` object.
  - >
    Agent is a Protocol, like Channel. New LLM backends implement prompt(str)->str.
    ClaudeCodeAgent delegates to the `claude` CLI via subprocess.
  - >
    CLI uses positional args for prompt input. Prompt files (one or many)
    are passed as positional args after workflow_name; their contents are
    concatenated into state['prompt']. If no files and stdin is piped,
    stdin is read. --model sets state['model']. File/stdin resolution
    happens in cli.py before reaching the channel. Handlers read from
    state, keeping the Runner/Channel layer unaware of LLM concerns.
  - >
    Errors propagate by default. Handler errors (missing keys), runtime issues
    (failed connections), and coding errors (naming mistakes) all propagate.
    Only edge validations (e.g. missing CLI params) are caught and reported
    when a stack trace would add no value.
  - >
    Per-run file logging. Each Runner creates an isolated log file. No console
    logging from the framework. Module-level loggers provide debug tracing.
  - >
    cc_handler factory: streaming pipeline; all events forwarded to runner.channel.report() —
    verbosity filtering is the channel's concern (verbose param on CliChannel/ApiChannel/SlackChannel).
    Fire-and-forget (no state_updates) = empty pipeline. Extraction mode = _extraction_middleware
    (haiku + --max-turns 1) splices internal extraction events after result. Factory model overrides
    state['model']; extraction always uses haiku. opts to primary agent only. yolo=True default.
    Handler __name__ set to label. See handler_factories section for full detail.
  - >
    Git worktree isolation. sdlc_iso creates a worktree per run on
    {feature_type}/{slug}, enabling parallel feature dev without cwd/branch
    conflicts. Worktrees kept after completion (remove=False) for inspection.
    App.worktree_dir configures base directory (default "trees/").
  - >
    BREAKING: Runner.fail() raises WorkflowFailedError instead of exit(1).
    This decouples workflow failure from process termination, enabling both
    CLI (which exits) and API (which continues serving) to handle failures
    appropriately. CLI catches WorkflowFailedError and exits 1. API server
    catches it in background task and continues serving other requests.
  - >
    Dual execution model: CLI and HTTP API. CliChannel and ApiChannel are nearly
    identical (stdout/stderr) but have different type identifiers. POST /webhook
    runs workflows in FastAPI BackgroundTasks (same process, scales with workers).
  - >
    Server factory pattern: create_app() loads agents file, returns configured
    FastAPI. Tests call create_app() with custom agents file. app = create_app()
    module-level for uvicorn. --agents-file propagated via ANTKEEPER_HANDLERS_FILE.
  - >
    Server as thin orchestrator. server.py defines routes inline and
    delegates to http/ package: handle_webhook (webhook.py) and
    SlackEventProcessor.handle_event (slack_events.py). Background
    task helper run_workflow_background lives in http/__init__.py.
    No setup_*_routes functions — server owns route definitions.
  - >
    Slack integration uses debounce pattern via SlackEventProcessor class
    (not closures). Bot mentions create a PendingMessage with a cooldown
    timer. Edits and thread replies reset the timer and accumulate
    text/files. Timer fire dispatches to the workflow handler. Pending
    store is instance-scoped on the processor for test isolation.
  - >
    SlackChannel uses sync httpx (handlers in threadpool); server endpoint uses
    async httpx (event loop). Independent clients. Thread context (channel_id,
    thread_ts) captured at construction from the @mention event.
  - >
    Slack env vars (SLACK_BOT_TOKEN, SLACK_BOT_USER_ID, SLACK_COOLDOWN_SECONDS,
    ANTKEEPER_SLACK_VERBOSE) read from environment at request time. python-dotenv
    loads .env file in create_app(). .env is gitignored.
  - >
    App-level env injection via App(env={...}). Values are static or callables(runner);
    resolved by Runner.run() before _app_env. App.log_dir also supports callables.
    Not thread-safe (os.environ is process-global); acceptable for single-threaded model.
  - >
    Automatic state persistence: Runner writes JSON state at 4 lifecycle points
    (before workflow, _progress init, after each step, after completion). State
    and log files share <timestamp>-<id> base name. Enables progress polling
    without handler-side persistence logic. See architecture.state_persistence.
