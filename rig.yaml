version: "0.2"
name: antkeeper-openrig-generator
summary: >
  Basic 2 agent rig for working on a converter from antkeeper to openrig

# Culture mirrors first-project/CULTURE.md; equality is checked in first-project-providers.test.ts.
culture_file: CULTURE.md

# OpenRig writes its instruction blocks here (ignored) instead of the tracked CLAUDE.md.
managed_blocks:
  claude-code: CLAUDE.local.md

pods:
  - id: dev
    label: Project
    members:
      - id: owner
        agent_ref: "local:.openrig/agents/implementer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: check
        agent_ref: "local:.openrig/agents/qa"
        runtime: claude-code
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: owner
        to: check

edges: []
